<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klima ist Statistik – Galtonbrett</title>
<meta name="description" content="">
<!-- Structure only. Design: theme/ · texts: content/texts.de.js · layout: css/ · behaviour: js/ -->
<script src="js/view.js" data-app="galton"></script>
<link rel="stylesheet" href="theme/theme.css">
<link rel="stylesheet" href="css/kit.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="top">
  <span class="logo" data-brand="logo"></span>
  <div class="top-right">
    <button type="button" class="view-toggle"></button>
  </div>
</header>

<div class="poster small">
  <div class="f f1"></div><div class="f f2"></div><div class="f f3"></div>
  <svg class="l2" viewBox="0 0 300 220" aria-hidden="true">
    <circle cx="150" cy="18" r="10" fill="currentColor"/>
    <circle cx="110" cy="70" r="7" fill="currentColor"/><circle cx="190" cy="70" r="7" fill="currentColor"/>
    <circle cx="70" cy="122" r="7" fill="currentColor"/><circle cx="150" cy="122" r="7" fill="currentColor"/><circle cx="230" cy="122" r="7" fill="currentColor"/>
    <path d="M20,205 C70,205 90,150 150,150 C210,150 230,205 280,205" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  </svg>
  <svg class="l3" viewBox="0 0 400 400" aria-hidden="true"><path d="M0,380 C120,380 130,60 200,60 C270,60 280,380 400,380"/></svg>
  <div class="poster-text">
    <h1 class="headline" data-t-html="poster.headline"></h1>
    <p class="lead" data-t="poster.lead"></p>
  </div>
</div>

<main class="page">
  <div class="lab">
    <div class="lab-stage">
      <div class="stage-frame square fit" id="stage-frame">
        <div id="stage" role="img" data-t-aria="stageAria">
          <canvas id="board-canvas"></canvas>
          <canvas id="ball-canvas"></canvas>
          <div class="bin-tooltip" id="bin-tooltip" hidden></div>
        </div>
        <div class="compare-ctl" id="compare-row">
          <button type="button" class="compare-chip" data-slot="0"><span class="compare-num">1</span></button>
          <button type="button" class="compare-chip" data-slot="1"><span class="compare-num">2</span></button>
          <button type="button" class="compare-chip" data-slot="2"><span class="compare-num">3</span></button>
          <span class="compare-unit" data-t="compare.label"></span>
        </div>
        <div class="cap-ctl" id="cap-ctl">
          <span class="cap-attn" id="cap-attn" data-t="cap.full" hidden></span>
          <button type="button" id="cap-up" data-t-aria="cap.more">+</button>
          <b id="cap-value">200</b>
          <button type="button" id="cap-down" data-t-aria="cap.less">&minus;</button>
          <span class="cap-unit" data-t="cap.unit"></span>
        </div>
      </div>
      <div class="sr-only" id="drop-ctl">
        <span data-t="drop.label"></span>
        <button type="button" id="drop-left" data-t-aria="drop.left">&minus;</button>
        <b id="drop-value" data-t="drop.middle"></b>
        <button type="button" id="drop-right" data-t-aria="drop.right">&plus;</button>
      </div>
    </div>

    <div class="lab-post">
      <div class="readout-grid" aria-live="polite">
        <div><span data-t="readout.balls"></span><b id="ro-fallen">0</b></div>
        <div><span data-t="readout.mean"></span><b id="ro-mean">–</b></div>
        <div><span data-t="readout.sd"></span><b id="ro-sd">–</b></div>
        <div><span data-t="readout.extremes"></span><b id="ro-extreme">0 %</b></div>
      </div>

      <!-- Everything that makes balls fall. Icons only: a play triangle, a
           single falling ball and a reset arrow need no caption, and the
           one (i) at the end names every button in this block. -->
      <div class="ctl-row">
        <button type="button" class="btn icon primary" id="sim-primary" data-t-aria="primary.startAria">
          <svg id="sim-primary-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 4l14 8-14 8V4z" fill="currentColor" stroke="none"/></svg>
        </button>
        <div class="count-ctl">
          <button type="button" class="sq" id="count-down" data-t-aria="readout.fewer">&minus;</button>
          <span class="count-val"><b class="val" id="ball-count-label">365</b><span class="count-unit" data-t="readout.balls"></span></span>
          <button type="button" class="sq" id="count-up" data-t-aria="readout.more">&plus;</button>
        </div>
        <button type="button" class="btn icon" id="sim-single" data-t-aria="primary.singleAria">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="7" r="3" fill="currentColor" stroke="none"/><path d="M12 12v7M9 16l3 3 3-3"/></svg>
        </button>
        <button type="button" class="btn icon" id="sim-reset" data-t-aria="primary.resetAria">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/></svg>
        </button>
        <button type="button" class="info" aria-controls="controls-help" data-t-aria="controls.infoAria"></button>
      </div>

      <!-- Everything that changes the board itself. -->
      <div class="ctl-row">
        <label class="climate-field">
          <span class="climate-label" data-t="scenario.group"></span>
          <select id="scenario-select" data-t-aria="scenario.selectAria">
            <option value="normal" data-t="scenario.normal"></option>
            <option value="extrem" data-t="scenario.extrem"></option>
            <option value="custom" hidden data-t="scenario.custom"></option>
          </select>
        </label>
        <button type="button" class="btn icon" id="tool-reset-board" data-t-aria="scenario.resetBoardAria">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/><circle cx="9.4" cy="13.6" r="1.5" fill="currentColor" stroke="none"/><circle cx="14.6" cy="13.6" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="9.6" r="1.5" fill="currentColor" stroke="none"/></svg>
        </button>
        <button type="button" class="btn icon" id="tool-wipe" data-t-aria="scenario.wipeAria">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 4.5L20.5 19.5H3.5z"/><path d="M8 9.5l8 8M16 9.5l-8 8" stroke-width="1.6"/></svg>
        </button>
        <button type="button" class="info" aria-controls="board-help" data-t-aria="scenario.infoAria"></button>
      </div>
      <div class="info-note" id="controls-help" hidden data-t-html="controls.note"></div>
      <div class="info-note" id="board-help" hidden data-t-html="scenario.note"></div>

      <button type="button" class="btn tasks-open" id="tasks-open" aria-haspopup="dialog" aria-controls="tasks-dialog">
        <span data-t="tasks.open"></span> <span class="quiz-progress" id="tasks-progress"></span>
      </button>
      <p class="hint" id="hint" hidden></p>

      <!-- Staff panel: ?dev, Shift+D or the faint (dev) link in the footer. -->
      <div class="dev-panel" id="dev-panel" hidden>
        <div class="dev-head">
          <span data-t="dev.title"></span>
          <button type="button" id="dev-close" data-t="dev.close"></button>
        </div>
        <div class="dev-row">
          <button type="button" id="dev-add-1000" data-t="dev.add1000"></button>
          <button type="button" id="dev-add-5000" data-t="dev.add5000"></button>
        </div>
        <div class="dev-row">
          <button type="button" id="dev-speed"></button>
          <button type="button" id="dev-collide"></button>
        </div>
        <div class="dev-row">
          <button type="button" id="dev-clear-balls" data-t="dev.clearBalls"></button>
        </div>
        <div class="dev-row">
          <button type="button" id="dev-theory"></button>
          <button type="button" id="dev-export" data-t="dev.exportCsv"></button>
        </div>
        <div class="dev-row"><button type="button" id="dev-scale"></button></div>
        <div class="dev-row">
          <button type="button" id="dev-pace"></button>
          <button type="button" id="dev-cap"></button>
        </div>
        <div class="dev-stats" id="dev-stats"></div>
        <div class="dev-note" data-t-html="dev.note"></div>
      </div>
    </div>
  </div>

  <dialog class="quiz-dialog" id="tasks-dialog" aria-labelledby="tasks-title">
    <div class="quiz-head">
      <h2 id="tasks-title" data-t="tasks.title"></h2>
      <button type="button" class="quiz-close" id="tasks-close" data-t-aria="tasks.closeAria">&times;</button>
    </div>
    <p class="quiz-intro" data-t="tasks.intro"></p>
    <div id="gb-tasks">
      <ol class="quiz-list">
        <li class="quiz-item" data-task="mountain"><p class="quiz-q" data-t="tasks.mountain"></p><p class="quiz-feedback" data-t="tasks.doneMountain"></p></li>
        <li class="quiz-item" data-task="shift"><p class="quiz-q" data-t="tasks.shift"></p><p class="quiz-feedback" data-t="tasks.doneShift"></p></li>
        <li class="quiz-item" data-task="extreme"><p class="quiz-q" data-t="tasks.extreme"></p><p class="quiz-feedback" data-t="tasks.doneExtreme"></p></li>
      </ol>
    </div>
  </dialog>

  <div class="topics">
    <details class="topic"><summary data-t="topics.use.title"></summary><div class="topic-body" data-t-html="topics.use.body"></div></details>
    <details class="topic"><summary data-t="topics.weather.title"></summary><div class="topic-body" data-t-html="topics.weather.body"></div></details>
    <details class="topic">
      <summary data-t="topics.change.title"></summary>
      <div class="topic-body">
        <div data-t-html="topics.change.intro"></div>
        <h3 data-t="topics.change.shiftTitle"></h3>
        <figure class="figure">
          <svg viewBox="0 0 320 130" role="img" data-t-aria="topics.change.shiftFigAria">
            <line class="ax" x1="12" y1="108" x2="308" y2="108" stroke-width="2"/>
            <path class="ax" d="M20,108 C70,108 76,26 116,26 C156,26 162,108 212,108" fill="none" stroke-width="2.5" stroke-dasharray="5 5"/>
            <path d="M76,108 C126,108 132,26 172,26 C212,26 218,108 268,108" fill="none" style="stroke:var(--shift)" stroke-width="3.5"/>
            <line class="ax" x1="116" y1="26" x2="116" y2="108" stroke-width="1.5" stroke-dasharray="3 3"/>
            <line x1="172" y1="26" x2="172" y2="108" style="stroke:var(--shift)" stroke-width="1.5" stroke-dasharray="3 3"/>
            <path d="M120,17 L168,17 M160,11 L168,17 L160,23" fill="none" style="stroke:var(--shift)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <text class="t" x="16" y="124" data-t="topics.change.cold"></text>
            <text class="t" x="272" y="124" data-t="topics.change.hot"></text>
          </svg>
          <figcaption data-t-html="topics.change.shiftCaption"></figcaption>
        </figure>
        <h3 data-t="topics.change.spreadTitle"></h3>
        <figure class="figure">
          <svg viewBox="0 0 320 130" role="img" data-t-aria="topics.change.spreadFigAria">
            <line class="ax" x1="12" y1="108" x2="308" y2="108" stroke-width="2"/>
            <path class="ax" d="M84,108 C124,108 130,26 160,26 C190,26 196,108 236,108" fill="none" stroke-width="2.5" stroke-dasharray="5 5"/>
            <path d="M20,108 C80,108 96,52 160,52 C224,52 240,108 300,108" fill="none" style="stroke:var(--spread)" stroke-width="3.5"/>
            <path d="M92,90 L28,90 M36,84 L28,90 L36,96" fill="none" style="stroke:var(--spread)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M228,90 L292,90 M284,84 L292,90 L284,96" fill="none" style="stroke:var(--spread)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <text class="t" x="16" y="124" data-t="topics.change.cold"></text>
            <text class="t" x="272" y="124" data-t="topics.change.hot"></text>
          </svg>
          <figcaption data-t-html="topics.change.spreadCaption"></figcaption>
        </figure>
        <h3 data-t="topics.change.extremeTitle"></h3>
        <figure class="figure">
          <svg viewBox="0 0 320 130" role="img" data-t-aria="topics.change.extremeFigAria">
            <line class="ax" x1="12" y1="108" x2="308" y2="108" stroke-width="2"/>
            <line x1="236" y1="16" x2="236" y2="108" style="stroke:var(--extreme)" stroke-width="2" stroke-dasharray="4 4"/>
            <path class="ax" d="M20,108 C70,108 76,26 116,26 C156,26 162,108 212,108" fill="none" stroke-width="2.5" stroke-dasharray="5 5"/>
            <path d="M56,108 C116,108 132,46 186,46 C240,46 252,108 306,108" fill="none" style="stroke:var(--extreme)" stroke-width="3.5"/>
            <path d="M236,108 C258,108 268,84 282,74 C292,67 300,101 306,108 Z" style="fill:var(--extreme)" opacity=".85"/>
            <text class="t" x="16" y="124" data-t="topics.change.cold"></text>
            <text class="t" x="196" y="12" style="fill:var(--extreme)" data-t="topics.change.threshold"></text>
          </svg>
          <figcaption data-t-html="topics.change.extremeCaption"></figcaption>
        </figure>
        <div data-t-html="topics.change.outro"></div>
      </div>
    </details>
    <details class="topic">
      <summary data-t="topics.bell.title"></summary>
      <div class="topic-body">
        <div data-t-html="topics.bell.intro"></div>
        <figure class="figure">
          <!-- Where the bell comes from, counted rather than asserted: at
               every nail the paths split in two, and the number in a slot
               is how many different ways lead there. The bottom row is
               the binomial row 1 4 6 4 1 -- the middle bin is six times
               as likely as an outer one, because six routes end there and
               only one ends outside. -->
          <svg viewBox="0 0 320 210" role="img" data-t-aria="topics.bell.figAria">
            <g class="ax" stroke-width="1.6" fill="none" opacity=".55">
              <path d="M160,26 L124,60 M160,26 L196,60"/>
              <path d="M124,60 L88,94 M124,60 L160,94 M196,60 L160,94 M196,60 L232,94"/>
              <path d="M88,94 L52,128 M88,94 L124,128 M160,94 L124,128 M160,94 L196,128 M232,94 L196,128 M232,94 L268,128"/>
              <path d="M52,128 L34,150 M52,128 L88,150 M124,128 L88,150 M124,128 L160,150 M196,128 L160,150 M196,128 L232,150 M268,128 L232,150 M268,128 L286,150"/>
            </g>
            <g fill="currentColor">
              <circle cx="160" cy="26" r="6"/>
              <circle cx="124" cy="60" r="6"/><circle cx="196" cy="60" r="6"/>
              <circle cx="88" cy="94" r="6"/><circle cx="160" cy="94" r="6"/><circle cx="232" cy="94" r="6"/>
              <circle cx="52" cy="128" r="6"/><circle cx="124" cy="128" r="6"/><circle cx="196" cy="128" r="6"/><circle cx="268" cy="128" r="6"/>
            </g>
            <g class="t" text-anchor="middle" font-size="11">
              <text x="139" y="46">&#189;</text><text x="183" y="46">&#189;</text>
            </g>
            <g class="t" text-anchor="middle" font-size="13" font-weight="700">
              <text x="34" y="172">1</text><text x="88" y="172">4</text><text x="160" y="172">6</text><text x="232" y="172">4</text><text x="286" y="172">1</text>
            </g>
            <g class="t" text-anchor="middle" font-size="10">
              <text x="34" y="190">1/16</text><text x="88" y="190">4/16</text><text x="160" y="190">6/16</text><text x="232" y="190">4/16</text><text x="286" y="190">1/16</text>
            </g>
            <g stroke="currentColor" stroke-width="1.6" opacity=".45">
              <line x1="16" y1="158" x2="304" y2="158"/>
            </g>
          </svg>
          <figcaption data-t-html="topics.bell.figCaption"></figcaption>
        </figure>
        <div data-t-html="topics.bell.body"></div>
      </div>
    </details>
  </div>
</main>

<footer class="foot">
  <p class="brand-line" data-brand="line"></p>
  <button type="button" class="dev-link" data-dev-link></button>
</footer>

<script src="theme/theme.js"></script>
<script src="content/texts.de.js"></script>
<script src="js/texts.js"></script>
<script src="js/brand.js"></script>
<script src="js/kit.js"></script>
<script src="js/app.js"></script>
</body>
</html>
